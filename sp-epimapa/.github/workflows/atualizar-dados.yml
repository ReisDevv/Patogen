# Rotina 1 do projeto: busca a série municipal no InfoDengue toda noite
# e faz commit do JSON atualizado. Com o GitHub Pages ligado, o site
# publicado passa a refletir os dados novos automaticamente.
name: Atualizar dados do InfoDengue

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC = 03:15 em São Paulo
  workflow_dispatch:        # permite rodar manualmente na aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar InfoDengue
        run: python scripts/fetch_infodengue.py --anos 2
      - name: Commitar se mudou
        run: |
          git config user.name "epimapa-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/infodengue.json
          git diff --cached --quiet && echo "sem mudanças" || git commit -m "dados: InfoDengue $(date -u +%F)"
          git push
