<style>
  /* Mesmos tokens do index.html. O GitHub Pages serve esta página para qualquer endereço inexistente. */
  :root {
    --bg: #e9edf1; --surface: #ffffff; --ink: #16202b; --muted: #5b6877; --line: #dde3e9;
    --accent: #1d5c7a; --accent-ink: #0f3a4f; --n3: #e8802f;
    --r-box: 12px; --r-ctl: 8px; --dur: 180ms;
    --sombra: 0 1px 2px rgba(22,32,43,.05), 0 10px 30px -8px rgba(22,32,43,.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
    font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.45;
    color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased;
  }
  main { width: min(440px, 100%); background: var(--surface); border-radius: var(--r-box); box-shadow: var(--sombra); padding: 28px; }
  .marca { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 500; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); position: relative; flex: none; }
  .logo::before, .logo::after { content: ""; position: absolute; border-radius: 50%; }
  .logo::before { width: 11px; height: 11px; background: #fff; left: 6px; top: 6px; }
  .logo::after { width: 7px; height: 7px; background: var(--n3); right: 6px; bottom: 6px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin: 20px 0 0; }
  p { color: var(--muted); margin: 8px 0 0; text-wrap: pretty; }
  a.btn {
    display: inline-flex; margin-top: 20px; padding: 10px 16px; border-radius: var(--r-ctl);
    background: var(--accent); color: #fff; font-weight: 500; text-decoration: none;
    transition: background var(--dur), transform var(--dur);
  }
  a.btn:hover { background: var(--accent-ink); }
  a.btn:active { transform: scale(.98); }
  .acoes { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; }
  .acoes a.link { margin-top: 20px; color: var(--accent); font-weight: 500; text-underline-offset: 2px; }
  .acoes a.link:hover { color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="marca"><span class="logo" aria-hidden="true"></span>Epimapa SP</div>
  <h1>Página não encontrada</h1>
  <p>O endereço pode estar incompleto ou ter mudado. O mapa de dengue, chikungunya e zika por distrito continua no mesmo lugar.</p>
  <div class="acoes">
    <a class="btn" href="/Patogen/mapa.html">Abrir o mapa</a>
    <a class="link" href="/Patogen/">Página inicial</a>
  </div>
</main>
</body>
