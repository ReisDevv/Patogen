# Rotina 2 do Epimapa SP: publica o site no GitHub Pages.
#
# O site (index.html + data/) fica na RAIZ do repositório justamente para que
# https://<user>.github.io/Patogen/ funcione nos dois modos do Pages:
#
#   - Settings > Pages > Source = "Deploy from a branch" (main, / root):
#     o Pages publica sozinho e este workflow é dispensável.
#   - Settings > Pages > Source = "GitHub Actions": quem publica é este
#     workflow, empacotando a raiz do repositório.
#
# Roda a cada push na main, então os commits de dados feitos por
# atualizar-dados.yml republicam o site automaticamente.
name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deixa um deploy em andamento terminar; enfileira no máximo um próximo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Empacotar a raiz do repositório como site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
