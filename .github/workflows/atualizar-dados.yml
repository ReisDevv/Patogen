# Rotina 1 do Epimapa SP: busca a série municipal no InfoDengue e o boletim
# semanal da COVISA toda noite e faz commit dos JSONs atualizados. Com o
# GitHub Pages ligado, o site publicado passa a refletir os dados novos.
#
# O boletim da COVISA sai às segundas; nos outros dias fetch_covisa.py
# reconhece que a SE já foi extraída e não faz nada.
name: Atualizar dados (InfoDengue e COVISA)

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC = 03:15 em São Paulo
  workflow_dispatch:        # permite rodar manualmente na aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências (pdfplumber, só para o scraper da COVISA)
        run: pip install -r requirements.txt
      - name: Buscar InfoDengue
        run: python scripts/fetch_infodengue.py --anos 2
      - name: Buscar boletim COVISA
        run: python scripts/fetch_covisa.py
      - name: Commitar se mudou
        run: |
          git config user.name "epimapa-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/infodengue.json data/casos_distrito.json data/covisa/
          git diff --cached --quiet && echo "sem mudanças" || git commit -m "dados: InfoDengue e COVISA $(date -u +%F)"
          git push
